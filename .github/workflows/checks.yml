name: Publish parenting feed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - uses: actions/cache/restore@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          path: data/ai-cache.json
          key: parenting-ai-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: parenting-ai-v1-
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      - run: npm run collect
        if: github.event_name != 'pull_request'
      - run: npm run enrich -- --cache-only
        if: github.event_name == 'push'
      - run: npm run enrich
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          AIHUB_API_KEY: ${{ secrets.AIHUB_API_KEY }}
          AIHUB_ENDPOINT: ${{ secrets.AIHUB_ENDPOINT }}
      - uses: actions/cache/save@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && hashFiles('data/ai-cache.json') != ''
        continue-on-error: true
        with:
          path: data/ai-cache.json
          key: parenting-ai-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm run build
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
